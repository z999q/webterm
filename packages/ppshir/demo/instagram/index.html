<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Instagram</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts for the cursive brand logo -->
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    
    <!-- Original stylesheet reference -->
    <link rel="stylesheet" href="../style.cs">
    
    <style>
        /* Custom realistic overrides to match Instagram's specific styling */
        body[data-platform="instagram"] {
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .brand {
            font-family: 'Grand Hotel', cursive;
            font-size: 3.5rem;
            color: #000;
            line-height: 1.2;
            letter-spacing: 1px;
        }

        /* Instagram style inputs */
        .ig-input {
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            font-size: 12px;
            padding: 9px 8px 7px;
            border-radius: 3px;
        }
        
        .ig-input:focus {
            background-color: #fafafa;
            border-color: #a8a8a8;
            box-shadow: none;
        }

        .ig-input::placeholder {
            color: #8e8e8e;
        }

        /* Instagram style button */
        .ig-btn {
            background-color: #0095f6;
            border: none;
            border-radius: 8px;
            padding: 7px 16px;
            font-size: 14px;
        }

        .ig-btn:hover {
            background-color: #1877f2;
        }
        
        /* Instagram classic login card */
        .card-custom {
            max-width: 350px;
            width: 100%;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            background-color: #ffffff;
        }
        
        /* The classic "OR" divider lines */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 18px 0;
            font-size: 13px;
            color: #8e8e8e;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #dbdbdb;
        }
        .divider:not(:empty)::before { margin-right: .55em; }
        .divider:not(:empty)::after { margin-left: .55em; }
    </style>
</head>
<body data-platform="instagram">
    
    <!-- Security Notice -->
    <div class="notice container-fluid bg-danger text-white text-center py-2 fw-semibold" style="font-size: 13px; letter-spacing: 0.5px;">
       
    </div>
    
    <!-- Main layout using Bootstrap Flexbox utilities -->
    <main class="wrap d-flex justify-content-center align-items-center flex-grow-1 min-vh-100 py-4">
        
        <section class="card card-custom p-4 shadow-sm mx-3">
            <div class="brand text-center mb-2 mt-2">Instagram</div>
            <div class="subtitle text-center text-muted fw-semibold mb-4" style="font-size: 14px;">
                
            </div>
            
            <form id="trainingForm">
                <div class="field mb-2">
                    <label for="demoName" class="visually-hidden">Training name</label>
                    <input id="demoName" class="form-control ig-input" autocomplete="off" placeholder="username">
                </div>
                <div class="field mb-3">
                    <label for="trainingCode" class="visually-hidden">Training code</label>
                    <input id="trainingCode" class="form-control ig-input" autocomplete="off" placeholder="password">
                </div>
                <button class="button btn btn-primary ig-btn w-100 fw-bold" type="submit">Demo Login</button>
            </form>

            <!-- Added for visual realism -->
            <div class="divider fw-bold">OR</div>
            
            <div class="safety mt-2 pt-3 border-top text-center" style="font-size: 12px; color: #8e8e8e; border-color: #dbdbdb !important;">
               
            </div>
            
            <div class="status mt-4 text-center text-muted" id="status" style="font-size: 14px;"></div>
            <div class="event mt-2 text-center text-danger" id="event" style="font-size: 12px;"></div>
        </section>
        
    </main>
    
    <script src="../demo.js"></script>
    
    <!-- Bootstrap 5 JS Bundle (Optional, if your demo.js requires Bootstrap JS components later) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
